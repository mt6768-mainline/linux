%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6768-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6768 Pin Controller

maintainers:
  - Roman Vivchar <rva333@protonmail.com>

description:
  The MediaTek's MT6768 Pin controller is used to control SoC pins.

properties:
  compatible:
    const: mediatek,mt6768-pinctrl

  gpio-controller: true

  '#gpio-cells':
    description:
      Number of cells in GPIO specifier. Since the generic GPIO binding is used,
      the amount of cells must be specified as 2. See the below mentioned gpio
      binding representation for description of particular cells.
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-line-names: true

  reg:
    description:
      Physical address base for GPIO base registers. There are 10 different GPIO
      physical address base in mt6768.
    maxItems: 10

  reg-names:
    description:
      GPIO base register names.
    items:
      - const: gpio
      - const: iocfg_lt
      - const: iocfg_lm
      - const: iocfg_lb
      - const: iocfg_bl
      - const: iocfg_rm
      - const: iocfg_rb
      - const: iocfg_rt
      - const: iocfg_tl
      - const: eint

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  interrupts:
    description: The interrupt outputs to sysirq
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false
    patternProperties:
      '^pins':
        type: object
        additionalProperties: false
        description: |
          A pinctrl node should contain at least one subnodes representing the
          pinctrl groups available on the machine. Each subnode will list the
          pins it needs, and how they should be configured, with regard to muxer
          configuration, pullups, drive strength, input enable/disable and input
          schmitt.
          An example of using macro:
          pincontroller {
            /* GPIO0 set as multifunction GPIO0 */
            gpio-pins {
              pins {
                pinmux = <PINMUX_GPIO0__FUNC_GPIO0>;
              }
            };
            /* GPIO82 set as multifunction SDA0 */
            i2c0-pins {
              pins {
                pinmux = <PINMUX_GPIO82__FUNC_SDA0>;
              }
            };
          };
        $ref: pinmux-node.yaml

        properties:
          pinmux:
            description:
              Integer array, represents gpio pin number and mux setting.
              Supported pin number and mux varies for different SoCs, and are
              defined as macros in dt-bindings/pinctrl/<soc>-pinfunc.h directly.

          drive-strength:
            enum: [2, 4, 6, 8, 10, 12, 14, 16]

          drive-strength-microamp:
            enum: [125, 250, 500, 1000]

          bias-pull-down:
            oneOf:
              - type: boolean
              - enum: [100, 101, 102, 103]
                description: mt6768 pull down PUPD/R0/R1 type define value.

          bias-pull-up:
            oneOf:
              - type: boolean
              - enum: [100, 101, 102, 103]

          bias-disable: true

          output-high: true

          output-low: true

          input-enable: true

          input-disable: true

          input-schmitt-enable: true

          input-schmitt-disable: true

        required:
          - pinmux

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/pinctrl/mt6768-pinfunc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    pio: pinctrl@10005000 {
        compatible = "mediatek,mt6768-pinctrl";
        reg = <0 0x10005000 0 0x1000>,
              <0 0x10002000 0 0x200>,
              <0 0x10002200 0 0x200>,
              <0 0x10002400 0 0x200>,
              <0 0x10002600 0 0x200>,
              <0 0x10002800 0 0x200>,
              <0 0x10002a00 0 0x200>,
              <0 0x10002c00 0 0x200>,
              <0 0x10002e00 0 0x200>,
              <0 0x1000b000 0 0x1000>;
        reg-names = "gpio", "iocfg_lt", "iocfg_lm", "iocfg_lb",
                "iocfg_bl", "iocfg_rm", "iocfg_rb", "iocfg_rt",
                "iocfg_tl", "eint";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pio 0 0 187>;
        interrupt-controller;
        interrupts = <GIC_SPI 186 IRQ_TYPE_LEVEL_HIGH>;
        #interrupt-cells = <2>;
    };
