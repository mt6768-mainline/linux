%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6768-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Functional Clock Controller for MT6768

maintainers:
  - Roman Vivchar <rva333@protonmail.com>

description: |
  The clock architecture in MediaTek like below
  PLLs -->
          dividers -->
                      muxes
                           -->
                              clock gate

  The devices provide clock gate control in different IP blocks.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt6768-imgsys
          - mediatek,mt6768-camsys
          - mediatek,mt6768-mipi0a
          - mediatek,mt6768-mipi0b
          - mediatek,mt6768-mipi1a
          - mediatek,mt6768-mipi1b
          - mediatek,mt6768-mipi2a
          - mediatek,mt6768-mipi2b
          - mediatek,mt6768-vdecsys
      - const: syscon
  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    imgsys: clock-controller@15020000 {
        compatible = "mediatek,mt6768-imgsys", "syscon";
        reg = <0x15020000 0x1000>;
        #clock-cells = <1>;
    };
