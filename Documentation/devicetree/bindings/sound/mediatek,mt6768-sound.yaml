%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6768-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6768 sound card with MT6358 codec

maintainers:
  - Roman Vivchar <rva333@protonmail.com>

properties:
  compatible:
    enum:
      - mediatek,mt6768-sound
      - mediatek,mt6768-mt6358-sound

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the MT6768 ASoC platform node (AFE).

  mediatek,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the audio codec node (MT6358).

  mediatek,speaker-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the external speaker codec node.

required:
  - compatible
  - mediatek,platform
  - mediatek,audio-codec

additionalProperties: false

examples:
  - |
    sound {
        compatible = "mediatek,mt6768-sound";
        mediatek,platform = <&afe>;
        mediatek,audio-codec = <&mt6358codec>;
        mediatek,speaker-codec = <&cs35l41>;
    };
