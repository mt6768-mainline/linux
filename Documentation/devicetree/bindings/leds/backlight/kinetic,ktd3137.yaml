%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/kinetic,ktd3137.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Kinetic Technologies KTD3137 LED Backlight

maintainers:
  - Roman Vivchar <rva333@protonmail.com>

description:
  The Kinetic Technologies KTD3137 is an I2C LED backlight driver for medium
  to large size LCD panels.

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    const: kinetic,ktd3137

  reg:
    maxItems: 1

  default-brightness:
    maximum: 2047
    default: 2047

  enable-gpios:
    maxItems: 1
    description: GPIO connected to the HWEN pin.

  led-max-microamp:
    minimum: 5000
    maximum: 29800
    default: 20200

  vin-supply: true

required:
  - compatible
  - reg
  - vin-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@36 {
            compatible = "kinetic,ktd3137";
            reg = <0x36>;
            enable-gpios = <&pio 160 GPIO_ACTIVE_HIGH>;
            led-max-microamp = <20200>;
            default-brightness = <2047>;
            vin-supply = <&vsys>;
        };
    };
